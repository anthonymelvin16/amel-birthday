<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify – 30 Mei 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-black: #000000;
            --bg-base: #121212;
            --bg-highlight: #1a1a1a;
            --spotify-green: #1db954;
            --text-gray: #b3b3b3;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: grid;
            grid-template-columns: 280px 1fr 340px; /* 3 Kolom ala Desktop */
            grid-template-rows: 1fr 90px;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR KIRI */
        .sidebar {
            background-color: var(--bg-black);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-card {
            background-color: var(--bg-base);
            border-radius: 8px;
            padding: 12px 20px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 20px;
            height: 40px;
            color: var(--text-gray);
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .nav-item:hover { color: white; }

        /* MAIN CONTENT (PLAYLIST) */
        .main-view {
            background: linear-gradient(to bottom, #222d3d, var(--bg-base) 40%);
            margin-top: 8px;
            border-radius: 8px;
            overflow-y: auto;
            position: relative;
        }
        .header-content {
            padding: 60px 24px 24px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
        }
        .playlist-cover {
            width: 232px;
            height: 232px;
            box-shadow: 0 4px 60px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        .playlist-info h1 {
            font-size: 80px;
            margin: 8px 0;
            letter-spacing: -4px;
        }

        /* SONG LIST TABLE */
        .tracklist-section { padding: 24px; }
        table { width: 100%; border-collapse: collapse; color: var(--text-gray); }
        th { text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px; font-size: 13px; }
        tr:hover { background-color: rgba(255,255,255,0.1); }
        tr.active { color: var(--spotify-green); }
        td { padding: 12px 10px; font-size: 14px; cursor: pointer; }

        /* SIDEBAR KANAN (NOW PLAYING VIEW) */
        .now-playing-view {
            background-color: var(--bg-base);
            margin: 8px 8px 8px 0;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .np-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .np-cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .np-details h2 { font-size: 24px; margin: 20px 0 4px; }
        .np-details p { color: var(--text-gray); margin: 0; }

        .about-artist {
            background-color: var(--bg-highlight);
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
        }
        .about-artist img { width: 100%; height: 120px; object-fit: cover; filter: brightness(0.7); }
        .about-content { padding: 16px; }
        .about-content h4 { margin: 0 0 8px; font-size: 14px; }
        .about-content p { font-size: 13px; color: var(--text-gray); line-height: 1.5; }

        /* PLAYER BAR (BAWAH) */
        .player-footer {
            grid-column: 1 / -1;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }
        .curr-track { display: flex; align-items: center; gap: 12px; width: 30%; }
        .curr-track img { width: 56px; height: 56px; border-radius: 4px; }

        .player-controls { width: 40%; display: flex; flex-direction: column; align-items: center; }
        .control-btns { display: flex; align-items: center; gap: 24px; margin-bottom: 8px; }
        .play-circle { background: white; color: black; border-radius: 50%; padding: 8px; display: flex; cursor: pointer; }
        
        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-gray); }
        .progress-bg { flex: 1; height: 4px; background: #4f4f4f; border-radius: 2px; position: relative; }
        #progress-fill { height: 100%; background: white; width: 0%; border-radius: 2px; }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <audio id="audioSource"></audio>

    <div class="sidebar">
        <div class="nav-card">
            <div class="nav-item" style="color: white;"><i data-lucide="home"></i> Home</div>
            <div class="nav-item"><i data-lucide="search"></i> Search</div>
        </div>
        <div class="nav-card" style="flex: 1;">
            <div class="nav-item"><i data-lucide="library"></i> Your Library</div>
        </div>
    </div>

    <div class="main-view">
        <div class="header-content">
            <img src="images/foto1.jpeg" class="playlist-cover">
            <div class="playlist-info">
                <p style="font-size: 14px; font-weight: 700;">Public Playlist</p>
                <h1>Happy Birthday Amel!!!💗💗💗</h1>
                <p><b>ameilya</b> • 6 songs, 19 min</p>
            </div>
        </div>

        <div class="tracklist-section">
            <table>
                <thead>
                    <tr>
                        <th width="50">#</th>
                        <th>Title</th>
                        <th>Album</th>
                        <th width="100"><i data-lucide="clock"></i></th>
                    </tr>
                </thead>
                <tbody id="track-list">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="now-playing-view">
        <div class="np-header">
            <h4 style="margin:0">Now playing</h4>
            <i data-lucide="x" style="cursor:pointer; width:20px;"></i>
        </div>
        <img id="np-img-side" src="images/foto1.jpeg" class="np-cover">
        
        <div class="np-details">
            <h2 id="np-title-side">Pilih lagu...</h2>
        </div>

        <div class="about-artist">
            <img id="np-img-banner" src="images/foto1.jpeg">
            <div class="about-content">
                <h4>About the memory</h4>
                <p id="np-desc-side"></p>
            </div>
        </div>
    </div>

    <div class="player-footer">
        <div class="curr-track">
            <img id="player-img" src="images/foto1.jpeg">
            <div>
                <div id="player-title" style="font-size: 14px; font-weight: 600;">Pilih lagu...</div>
                <div style="font-size: 11px; color: var(--text-gray);"></div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <i data-lucide="shuffle" style="width:18px; color:var(--text-gray)"></i>
                <i data-lucide="skip-back" onclick="prev()"></i>
                <div class="play-circle" onclick="togglePlay()">
                    <i data-lucide="play" id="play-icon-main"></i>
                </div>
                <i data-lucide="skip-forward" onclick="next()"></i>
                <i data-lucide="repeat" style="width:18px; color:var(--text-gray)"></i>
            </div>
            <div class="progress-container">
                <span>0:00</span>
                <div class="progress-bg"><div id="progress-fill"></div></div>
                <span>3:00</span>
            </div>
        </div>

        <div style="width: 30%; display: flex; justify-content: flex-end; gap: 15px; color: var(--text-gray);">
            <i data-lucide="mic-2" style="width:18px"></i>
            <i data-lucide="list-music" style="width:18px"></i>
            <i data-lucide="volume-2" style="width:18px"></i>
            <div style="width: 100px; height: 4px; background: #4f4f4f; border-radius: 2px; align-self: center;"></div>
        </div>
    </div>

    <script>
        const songs = [
            { id: 1, title: "Nemenin Beli Jaket", album: "Pasar Kosambi", img: "images/foto1.jpeg", file: "lagu1.mp3", desc: "ini pas kamu ngeliat jaket yang kamu mau tapi malah aku yang beli😝. btw aku suka outfit kamu di foto ini💗." },
            { id: 2, title: "Tahun Baruan", album: "Cafe Senja", img: "images/foto2.jpeg", file: "lagu2.mp3", desc: "Tahun baruan kedua kalinya, aku pilih foto ini karna pas tahun baruan pertama kita kayanya gaada foto deh😌." },
            { id: 3, title: "Keliling Sekolah Kamu", album: "SMAN 14 Bandung", img: "images/foto3.jpeg", file: "lagu3.mp3", desc: "Kamu ngajak aku keliling keliling sekolah kamu, terus juga kita foto bareng di tengah lapangan. kamu cantik banget di foto ini💗" },
            { id: 4, title: "Foto Favorit", album: "Rumah Kamu", img: "images/foto4.jpeg", file: "lagu4.mp3", desc: "Foto favorit aku, karna menurut aku kamu cantik banget di foto ini, terus juga warna rambutnya masi bagus sama pose nya imut🫠." },
            { id: 5, title: "Lebaran Sama Kamu", album: "Jalan Kanayakan", img: "images/foto5.jpeg", file: "lagu5.mp3", desc: "Pertama kali ngerasain lebaran pada umumnya, tahun lalu lebaran bareng juga tapi yang tahun ini lebih kerasa lebarannya karna lebih banyak ketemu sodara kamu, bahkan sampe ke rumah sodara kamu😭." },
            { id: 6, title: "Makan Bareng", album: "Villa Istana Bunga", img: "images/foto6.jpeg", file: "lagu6.mp3", desc: "Ini aku jadi keinget OSFAK pas aku makan sendirian di PKM yang kamu tiba tiba nyamperin aku terus kita makan bareng😁. " }
        ];

        let currIndex = 0;
        const audio = document.getElementById('audioSource');
        const trackList = document.getElementById('track-list');

        // Render Lagu ke Table
        songs.forEach((s, i) => {
            trackList.innerHTML += `
                <tr onclick="selectSong(${i})" id="row-${i}">
                    <td>${s.id}</td>
                    <td>
                        <div style="color: white; font-weight: 600;">${s.title}</div>
                        <div style="font-size: 12px;">amel melvin</div>
                    </td>
                    <td>${s.album}</td>
                    <td>3:00</td>
                </tr>
            `;
        });

        lucide.createIcons();

        function selectSong(i) {
            // Reset style row lama
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('active'));
            document.getElementById(`row-${i}`).classList.add('active');

            currIndex = i;
            const s = songs[i];
            
            // Update UI Player
            document.getElementById('player-img').src = s.img;
            document.getElementById('player-title').innerText = s.title;
            
            // Update UI Right Sidebar (Now Playing View)
            document.getElementById('np-img-side').src = s.img;
            document.getElementById('np-img-banner').src = s.img;
            document.getElementById('np-title-side').innerText = s.title;
            document.getElementById('np-desc-side').innerText = s.desc;

            audio.src = s.file;
            audio.play();
            updatePlayIcon(true);
        }

        function togglePlay() {
            if (!audio.src) return;
            audio.paused ? (audio.play(), updatePlayIcon(true)) : (audio.pause(), updatePlayIcon(false));
        }

        function updatePlayIcon(isPlay) {
            document.getElementById('play-icon-main').setAttribute('data-lucide', isPlay ? 'pause' : 'play');
            lucide.createIcons();
        }

        function next() { currIndex = (currIndex + 1) % songs.length; selectSong(currIndex); }
        function prev() { currIndex = (currIndex - 1 + songs.length) % songs.length; selectSong(currIndex); }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const fill = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progress-fill').style.width = fill + "%";
            }
        };
    </script>
</body>
</html>
